<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Дело о фасадах</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* layout: one 9:16 reel frame centered on a paper-grid stage, controls below */
:root{
  --paper:#f6e9e8; --grid:#e8d3d2; --ink:#4a3f45; --muted:#9a8a90;
  --stamp:#5b5fb0; --hat:#e0773a; --money:#3f8a5a; --stage:#eadcdc;
  --mono:"JetBrains Mono","PT Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--mono);margin:0;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:14px}
.reel{width:min(100%,400px);aspect-ratio:9/16;max-width:100%;border-radius:12px;overflow:hidden;box-shadow:0 10px 40px rgba(74,63,69,.18);background:var(--paper)}
svg{display:block;width:100%;height:100%}
svg text{font-family:var(--mono);fill:var(--ink)}
.fade{opacity:0;transition:opacity .6s ease}
.on{opacity:1}
.mv{transition:transform 1s cubic-bezier(.5,0,.3,1),opacity .6s ease;transform-box:fill-box}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font-family:var(--mono);font-size:13px;background:var(--paper);color:var(--ink);border:1px solid var(--ink);border-radius:6px;padding:8px 14px;cursor:pointer}
button:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.note{font-size:12px;color:var(--muted);max-width:400px;text-align:center;line-height:1.5}
@keyframes bang{0%,100%{transform:rotate(0)}40%{transform:rotate(-35deg)}60%{transform:rotate(8deg)}}
.bang{animation:bang .5s ease 3}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bob{animation:bob .45s ease 4}
@media (prefers-reduced-motion:reduce){.mv,.fade{transition:none}.bang,.bob{animation:none}}
</style>

<div class="reel">
<svg viewBox="0 0 360 640" role="img" aria-label="Анимированный разбор дела: подрядчик 10 лет ждал оплату за фасады">
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern>
    <path id="arc" d="M-27,0 A27,27 0 0 1 27,0"/>
  </defs>
  <rect width="360" height="640" fill="var(--paper)"/>
  <rect width="360" height="640" fill="url(#g)"/>
  <text x="28" y="56" font-size="11" fill="var(--muted)" style="fill:var(--muted)">разбор дела · серия 1</text>
  <text x="332" y="56" font-size="11" text-anchor="end" style="fill:var(--muted)">ИЮР</text>
  <rect x="24" y="70" width="312" height="480" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
  <line x1="40" y1="470" x2="320" y2="470" stroke="var(--ink)" stroke-width="1"/>
  <text x="180" y="590" font-size="10" text-anchor="middle" style="fill:var(--muted)">взыскание долга по госконтракту · urreshenie.ru</text>

  <!-- year -->
  <text id="year" x="180" y="140" font-size="46" font-weight="700" text-anchor="middle" class="fade">2011</text>
  <text id="sub" x="180" y="166" font-size="11" text-anchor="middle" class="fade" style="fill:var(--muted)">контракт № 009 · вентфасады</text>

  <!-- building -->
  <g id="bld" class="fade">
    <rect x="125" y="240" width="110" height="230" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
    <g stroke="var(--stamp)" stroke-width="1" fill="none" opacity=".7">
      <path d="M125 270H235M125 300H235M125 330H235M125 360H235M125 390H235M125 420H235M125 450H235M152 240V470M180 240V470M208 240V470"/>
    </g>
    <rect x="168" y="440" width="24" height="30" fill="var(--paper)" stroke="var(--ink)"/>
  </g>

  <!-- court -->
  <g id="court" class="fade">
    <rect x="120" y="390" width="120" height="80" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
    <text x="180" y="425" font-size="12" text-anchor="middle" font-weight="700">АРБИТРАЖ</text>
    <text x="180" y="445" font-size="9" text-anchor="middle" style="fill:var(--muted)">дело А05-8519/2021</text>
    <g id="gavel" style="transform-origin:200px 380px;transform-box:view-box">
      <rect x="196" y="330" width="6" height="50" fill="var(--ink)" transform="rotate(-50 199 380)"/>
      <rect x="150" y="332" width="34" height="16" rx="3" fill="var(--hat)" stroke="var(--ink)" transform="rotate(-50 199 380)"/>
    </g>
  </g>

  <!-- money -->
  <g id="money" class="fade">
    <text x="180" y="240" font-size="26" font-weight="700" text-anchor="middle" style="fill:var(--money)">10 191 156 ₽</text>
    <text x="180" y="262" font-size="10" text-anchor="middle" style="fill:var(--muted)">долг за выполненные работы</text>
  </g>

  <!-- settlement -->
  <g id="deal" class="fade">
    <rect x="135" y="215" width="90" height="118" fill="#fff8f8" stroke="var(--ink)" stroke-width="1.2"/>
    <text x="180" y="236" font-size="10" font-weight="700" text-anchor="middle">МИРОВОЕ</text>
    <path d="M147 252H213M147 264H213M147 276H200M147 288H213" stroke="var(--muted)"/>
    <g id="imprint" class="fade"><circle cx="196" cy="310" r="15" fill="none" stroke="var(--stamp)" stroke-width="2"/><text x="196" y="313" font-size="7" text-anchor="middle" style="fill:var(--stamp)">ПРИЗНАЮ</text></g>
  </g>

  <!-- contractor -->
  <g id="pod" class="mv fade" style="transform:translate(0px,0px)">
    <circle cx="72" cy="380" r="13" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/>
    <path d="M58 377a14 14 0 0 1 28 0z" fill="var(--hat)" stroke="var(--ink)"/>
    <rect x="54" y="376" width="36" height="3" fill="var(--hat)"/>
    <g id="face-ok"><circle cx="67" cy="384" r="1.5" fill="var(--ink)"/><circle cx="77" cy="384" r="1.5" fill="var(--ink)"/><path d="M67 388q5 4 10 0" fill="none" stroke="var(--ink)"/></g>
    <g id="face-sad" class="fade"><path d="M63 381q3 -1 6 -3M81 381q-3 -1 -6 -3" fill="none" stroke="var(--ink)"/><circle cx="67" cy="384.5" r="1.5" fill="var(--ink)"/><circle cx="77" cy="384.5" r="1.5" fill="var(--ink)"/><path d="M68 391q4 -2 8 0" fill="none" stroke="var(--ink)"/><path d="M85 383q2 3 0 5q-2 -2 0 -5z" fill="var(--stamp)" opacity=".6"/></g>
    <rect x="58" y="395" width="28" height="40" fill="var(--ink)"/>
    <path d="M58 400L46 422M86 400L98 422M64 435L56 470M80 435L88 470" stroke="var(--ink)" stroke-width="1.5"/>
    <g id="web" class="fade" stroke="var(--muted)" stroke-width=".8" fill="none">
      <path d="M40 360l40 40M40 400l40-40M60 355v50M37 380h46"/><circle cx="60" cy="380" r="9"/><circle cx="60" cy="380" r="17"/>
    </g>
  </g>

  <!-- stamp customer -->
  <g id="stamp" class="mv fade" style="transform:translate(0px,0px)">
    <g id="stampbody" style="transform-origin:285px 410px;transform-box:view-box;transition:transform .6s">
      <circle cx="285" cy="410" r="34" fill="#fbf2f4" stroke="var(--stamp)" stroke-width="2"/>
      <circle cx="285" cy="410" r="25" fill="none" stroke="var(--stamp)"/>
      <text font-size="8" style="fill:var(--stamp)" transform="translate(285 410)"><textPath href="#arc" startOffset="50%" text-anchor="middle">ЗАКАЗЧИК</textPath></text>
      <path d="M274 403l7 3M296 403l-7 3" stroke="var(--ink)" stroke-width="1.5"/>
      <circle cx="278" cy="409" r="1.8" fill="var(--ink)"/><circle cx="292" cy="409" r="1.8" fill="var(--ink)"/>
      <path id="smile" d="M277 418q8 6 16 0" fill="none" stroke="var(--ink)" stroke-width="1.3"/>
      <text x="285" y="434" font-size="6" text-anchor="middle" style="fill:var(--stamp)">м.п.</text>
    </g>
    <path d="M275 443L272 470M295 443L298 470M251 405L235 395M319 405L333 390" stroke="var(--ink)" stroke-width="1.5"/>
  </g>

  <!-- KS-2 doc -->
  <g id="doc" class="mv fade" style="transform:translate(0px,0px)">
    <rect x="96" y="300" width="44" height="56" fill="#fff8f8" stroke="var(--ink)"/>
    <text x="102" y="314" font-size="9">КС-2</text>
    <path d="M102 324H134M102 334H134M102 344H124" stroke="var(--muted)"/>
  </g>

  <!-- bullets -->
  <g id="facts" class="fade">
    <text x="180" y="360" font-size="12" text-anchor="middle">✓ оплата в течение 3 месяцев</text>
    <text x="180" y="382" font-size="12" text-anchor="middle">✓ 70% госпошлины вернули</text>
  </g>

  <!-- caption -->
  <text id="cap" x="180" y="515" font-size="13" text-anchor="middle" font-weight="700"><tspan id="c1" x="180"></tspan><tspan id="c2" x="180" dy="18"></tspan></text>

  <!-- final card -->
  <g id="final" class="fade">
    <rect x="24" y="70" width="312" height="480" fill="var(--paper)"/>
    <rect x="24" y="70" width="312" height="480" fill="url(#g)"/>
    <rect x="24" y="70" width="312" height="480" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
    <text x="180" y="210" font-size="15" text-anchor="middle" font-weight="700">Подрядчику повезло:</text>
    <text x="180" y="232" font-size="15" text-anchor="middle" font-weight="700">заказчик признал долг.</text>
    <text x="180" y="280" font-size="12" text-anchor="middle">Без признания суд мог бы</text>
    <text x="180" y="298" font-size="12" text-anchor="middle">отказать по сроку давности.</text>
    <text x="180" y="316" font-size="12" text-anchor="middle">Он всего 3 года.</text>
    <rect x="70" y="370" width="220" height="44" rx="6" fill="var(--ink)"/>
    <text x="180" y="397" font-size="13" text-anchor="middle" font-weight="700" style="fill:var(--paper)">Не ждите 10 лет</text>
    <text x="180" y="440" font-size="11" text-anchor="middle" style="fill:var(--muted)">разберём ваш долг · urreshenie.ru</text>
  </g>
</svg>
</div>

<div class="controls">
  <button id="replay" type="button">Сначала</button>
  <button id="pause" type="button">Пауза</button>
</div>
<p class="note">Ролик длится около 30 секунд и крутится по кругу. Для рилс: открой на телефоне на весь экран и запиши экран, звук наложи в CapCut.</p>

<script>
const $=id=>document.getElementById(id);
const show=(id,v=true)=>$(id).classList.toggle('on',v);
const mv=(id,x,y)=>{$(id).style.transform=`translate(${x}px,${y}px)`};
const cap=(a,b='')=>{$('c1').textContent=a;$('c2').textContent=b};
let timers=[],paused=false,t0=0,elapsed=0,yearTimer=null;

function reset(){
  ['year','sub','bld','court','money','deal','imprint','pod','stamp','doc','facts','final','web','face-sad'].forEach(i=>show(i,false));
  show('face-ok');mv('pod',0,0);mv('stamp',0,0);mv('doc',0,0);
  $('stampbody').style.transform='';$('gavel').classList.remove('bang');$('stamp').classList.remove('bob');
  $('year').textContent='2011';$('sub').textContent='контракт № 009 · вентфасады';cap('');
}
const steps=[
 [0,()=>{reset();show('year');show('sub');show('bld');show('pod');show('stamp');cap('Подрядчик утепляет','фасады многоэтажек')}],
 [2600,()=>{show('doc');cap('Работы сданы,','акты КС-2 у заказчика')}],
 [3400,()=>mv('doc',140,30)],
 [5200,()=>{show('doc',false);$('stampbody').style.transform='scaleX(-1)';cap('Оплаты нет')}],
 [7000,()=>{cap('Год. Второй.','Девятый.');show('sub',false);show('face-ok',false);show('face-sad');
   let y=2011;yearTimer=setInterval(()=>{y++;$('year').textContent=y;if(y===2015)show('web');if(y>=2020)clearInterval(yearTimer)},650)}],
 [13600,()=>{show('bld',false);show('web',false);$('year').textContent='2021';$('sub').textContent='иск в арбитражный суд';show('sub');show('court');$('gavel').classList.add('bang');cap('Подрядчик идёт в суд')}],
 [15400,()=>{show('money');show('year',false);show('sub',false)}],
 [18000,()=>{show('court',false);show('money',false);$('stampbody').style.transform='';show('deal');mv('stamp',-60,-20);cap('Заказчик признаёт','долг полностью')}],
 [19500,()=>{show('imprint');$('stamp').classList.add('bob')}],
 [21500,()=>{mv('stamp',0,0);show('face-sad',false);show('face-ok');show('facts');cap('Мировое соглашение','утверждено судом')}],
 [25000,()=>show('final')],
 [31000,()=>run(0)]
];
function run(from){
  timers.forEach(clearTimeout);timers=[];clearInterval(yearTimer);
  if(from===0)reset();
  steps.forEach(([t,f])=>{if(t>=from)timers.push(setTimeout(f,t-from))});
  t0=performance.now()-from;
}
// pause: replay steps up to the paused moment instantly on resume
$('pause').onclick=()=>{
  if(!paused){elapsed=performance.now()-t0;timers.forEach(clearTimeout);clearInterval(yearTimer);paused=true;$('pause').textContent='Дальше'}
  else{paused=false;$('pause').textContent='Пауза';timers=[];steps.forEach(([t,f])=>{if(t>=elapsed)timers.push(setTimeout(f,t-elapsed))});t0=performance.now()-elapsed}
};
$('replay').onclick=()=>{paused=false;$('pause').textContent='Пауза';run(0)};
run(0);
</script>

</body></html>
